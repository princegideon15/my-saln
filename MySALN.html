<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MySALN</title>
<style>
:root{--bg:#f4f6fb;--sf:#fff;--sf2:#eef1f8;--tx:#16203a;--mu:#5b6685;--bd:#d9dfec;--ac:#2347b8;--ac2:#e6ecff;--dg:#c62828;--ok:#1b7f4b;--sh:0 1px 3px rgba(20,30,60,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0b;--sf:#161618;--sf2:#212124;--tx:#ececee;--mu:#9b9ba3;--bd:#303034;--ac:#3478f6;--ac2:#14233f;--dg:#ff6b6b;--ok:#5fd397;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0b;--sf:#161618;--sf2:#212124;--tx:#ececee;--mu:#9b9ba3;--bd:#303034;--ac:#3478f6;--ac2:#14233f;--dg:#ff6b6b;--ok:#5fd397;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;margin-right:auto}
.logo i{background:var(--ac);color:#fff;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-style:normal;font-size:13px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 80px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:7px 12px;display:inline-flex;gap:6px;align-items:center}
button:hover,.btn:hover{background:var(--sf2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}.pri:hover{background:var(--ac);filter:brightness(1.1)}
.dng{color:var(--dg);border-color:var(--dg)}.sm{padding:4px 9px;font-size:13px}
h1{font-size:22px;margin:0 0 4px}.mu{color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.entry{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center}
.yr{font-size:26px;font-weight:800;color:var(--ac);background:var(--ac2);border-radius:10px;text-align:center;padding:10px 0}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nw{font-weight:700}
.badge{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--sf2);color:var(--mu);margin-left:6px}
.empty{text-align:center;padding:48px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mu);font-weight:600}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-top:3px}
input[type=radio]{width:auto;margin:0 6px 0 0}
.opt{display:inline-flex;align-items:center;margin-right:16px;font-size:14px;color:var(--tx);font-weight:400}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:16px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.row{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--sf2)}
.row .grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.rowh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;color:var(--mu)}
.bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px));z-index:4;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;box-shadow:0 -2px 12px rgba(0,0,0,.12)}
.bar b{display:block;font-size:16px}.bar span{font-size:12px;color:var(--mu)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);padding:20px;max-width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog.wide{max-width:min(900px,96vw);width:100%;padding:12px;max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:20;font-size:14px}
.err{color:var(--dg);font-size:13px;margin-top:4px}
@media(max-width:640px){.entry{grid-template-columns:70px 1fr}.acts{grid-column:1/-1;justify-content:flex-start}}
#printArea{display:none}
@media print{@page{size:8.5in 13in;margin:.5in}:root{padding:0}body>*:not(#printArea){display:none!important}#printArea{display:block}body{background:#fff;margin:0}#printArea .paper{max-width:none;padding:0;margin:0}#printArea .paper .hdr{position:fixed;top:-.32in;right:0;margin:0}}

header{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--sf) 88%,transparent)}
button,.btn{transition:background .15s,transform .05s;font-weight:500}button:active{transform:scale(.98)}
.pri{box-shadow:0 1px 2px rgba(35,71,184,.35)}
.card{border-radius:14px;transition:box-shadow .15s,border-color .15s}.entry:hover{border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stats div{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:var(--mu)}
.search{max-width:360px;margin:0 0 14px}
.logo{gap:10px;font-size:19px;letter-spacing:-.02em}.wm{font-weight:500}.wm b{font-weight:800;color:var(--ac)}.logo svg{flex:none;filter:drop-shadow(0 1px 2px rgba(20,30,60,.25))}
.foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px 16px 28px;font-size:13px;color:var(--mu)}.foot a{color:var(--ac);text-decoration:none;font-weight:600}.foot a:hover{text-decoration:underline}
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:6px;background:var(--bg)}
.chips button{border-radius:99px;white-space:nowrap;font-size:13px;padding:5px 12px}
.card[id]{scroll-margin-top:110px}
input,select{transition:border-color .15s,box-shadow .15s}input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
#cb{position:fixed;z-index:30;max-height:260px;overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:4px}
#cb div{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14px}#cb div:hover,#cb div.on{background:var(--ac2)}#cb .nm0{cursor:default;color:var(--mu);font-size:13px}
label{position:relative}.span{grid-column:1/-1}
.ic{display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;border-radius:50%;background:var(--ac2);color:var(--ac);font:700 11px/1 Georgia,serif;font-style:italic;cursor:help;vertical-align:1px}
.ic:hover::after,.ic:focus::after{content:attr(data-tip);position:absolute;left:0;top:100%;z-index:12;width:min(260px,90vw);padding:7px 10px;border-radius:8px;background:var(--tx);color:var(--bg);font:400 12px/1.4 system-ui,sans-serif;font-style:normal;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#tcard{position:fixed;z-index:61;width:min(340px,calc(100vw - 16px));background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.35)}#tspot{position:fixed;z-index:60;border-radius:12px;box-shadow:0 0 0 3px var(--ac),0 0 0 100vmax rgba(0,0,0,.5);pointer-events:none;transition:all .2s}#tDots{display:flex;gap:6px;margin:12px 0}#tDots i{width:8px;height:8px;border-radius:50%;background:var(--bd)}#tDots i.on{background:var(--ac);width:22px;border-radius:99px}
button:disabled{opacity:.4;cursor:default}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="docstyle">
.paper{background:#fff;color:#000;font:11px/1.3 "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;padding:24px;max-width:8.5in;margin:0 auto}
.paper .hdr{text-align:right;font-size:8px;margin-left:auto;width:2.2in;text-align:left}
.paper .ttl{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-top:22px;gap:8px}
.paper .asof{display:inline-block;min-width:1.7in;text-align:center;margin-left:6px;font-size:11px}
.paper .c{text-align:center}.paper .it{font-style:italic;margin:12px 0 14px}
.paper .nm{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;font-size:10px;margin-top:6px}
.paper .ln,.paper .lb{display:grid;grid-template-columns:1.4fr 1fr .5fr;gap:10px;margin-left:48px;text-align:center}
.paper .ln{border-bottom:1px solid #000;min-height:15px}.paper .lb{font-size:8px;font-style:normal}
.paper .n2 div{border-bottom:1px solid #000;margin-bottom:6px;min-height:15px}.paper .n2 u{text-decoration:none;padding-left:6px}
.paper hr.thick{border:0;border-top:2px solid #000;margin:8px 0 12px}
.paper .ul{text-decoration:underline;margin-bottom:10px;font-size:11px}
.paper .h{font-weight:700;margin:8px 0 4px 6px}.paper .h2{font-weight:700;margin:6px 0 4px 22px}
.paper table.g{width:100%;border-collapse:collapse;margin:2px 0 4px;table-layout:fixed}
.paper .g th,.paper .g td{border:1px solid #000;padding:2px 4px;font-size:10px;vertical-align:top;word-wrap:break-word}
.paper .g th{background:#c0c0c0;text-align:center;font-size:9px;text-transform:uppercase}
.paper .g th small{display:block;text-transform:none;font-weight:400;font-size:7px}
.paper .g tr.b td{height:38px}.paper .g tr.s td{height:14px}
.paper .g td.r{text-align:right}.paper .g td.c{text-align:center}
.paper .tot{text-align:right;font-weight:700;margin:2px 4px 6px 0;font-size:11px}
.paper .tot b{display:inline-block;min-width:1.5in;border-bottom:1px solid #000;font-weight:400}
.paper .sg{width:2in;margin:26px 0 0 auto;border-top:1px solid #000;text-align:center;font-style:italic;font-size:8px}
.paper .pg{text-align:center;font-style:italic;margin-top:14px}
.paper,.paper *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{.paper{padding:0}}
</style>
</style>
</head>

 <table class="g"><colgroup><col style="width:33%"><col style="width:42%"><col style="width:25%"></colgroup><tr><th>Nature</th><th>Name of Creditors</th><th>Outstanding Balance</th></tr>
 ${rows(e.liab,4,"s",r=>`<td>${esc(r.nature)}</td><td>${esc(r.cred)}</td><td class="r">${m(r.bal)}</td>`)}</table>
 <div class="tot">TOTAL LIABILITIES: <b>${peso(t.L)}</b></div>

 ${rows(e.biz,3,"b",r=>`<td>${esc(r.ent)}</td><td>${esc(r.addr)}</td><td>${esc(r.nat)}</td><td class="c">${esc(r.date)}</td>`)}</table>
 <div class="sg">Signature/Initial of Declarant</div><div class="pg">Page ____ of ____</div></div>`}
const fullDoc=e=>`<!DOCTYPE html><html><head><meta charset="utf-8"><title>SALN ${esc(e.year)}</title><style>${$("#docstyle").textContent}@page{size:8.5in 13in;margin:.5in}body{margin:0}.paper .hdr{position:fixed;top:-.32in;right:0;margin:0}</style></head><body>${docHTML(e)}</body></html>`;
function doPrint(e){$("#printArea").innerHTML=docHTML(e);setTimeout(()=>{try{print()}catch(x){toast("Printing is blocked in this view. Use Download PDF, then print the PDF.",6000)}},80)}
addEventListener("afterprint",()=>{$("#printArea").innerHTML=""});
function showPrev(e){const p=$("#prev");$("#pBody").innerHTML=docHTML(e);$("#pPrint").onclick=()=>doPrint(e);$("#pDl").onclick=()=>doDl(e);$("#pClose").onclick=()=>p.close();p.showModal()}
function anchorSave(f,data){const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement("a");a.href=u;a.download=f;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000)}
async function save(filename,data,ok){const d=await getDl();if(!d){anchorSave(filename,data);return toast("Download started. If nothing happens, open the artifact in claude.ai.",5000)}
 try{await d.save({filename,data});toast(ok)}catch(x){const c=x&&x.code;if(c==="declined")return;if(["unavailable","not_granted","capability_disabled","capability_removed"].includes(c)){anchorSave(filename,data);return toast("Download started. If nothing happens, open the artifact in claude.ai.",5000)}toast("Couldn’t save the file ("+(c||"error")+").",6000)}}
const loadJs=u=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.append(s)});
async function mkPdf(e){
 if(!window.html2canvas)await loadJs("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
 if(!window.jspdf)await loadJs("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
 const h=document.createElement("div");h.style.cssText="position:fixed;left:-9999px;top:0;width:720px;background:#fff";h.innerHTML="<style>"+$("#docstyle").textContent+".paper{padding:0;max-width:none}.paper .hdr{display:none}</style>"+docHTML(e);document.body.append(h);
 const cv=await html2canvas(h.querySelector(".paper"),{scale:2,backgroundColor:"#fff"});h.remove();
 const pdf=new window.jspdf.jsPDF({unit:"in",format:[8.5,13]}),per=Math.floor(cv.width*12.2/7.5);
 for(let y=0,i=0;y<cv.height;y+=per,i++){const c=document.createElement("canvas");c.width=cv.width;c.height=Math.min(per,cv.height-y);c.getContext("2d").drawImage(cv,0,y,cv.width,c.height,0,0,cv.width,c.height);if(i)pdf.addPage([8.5,13]);
  pdf.setFont("times","normal");pdf.setFontSize(7);["SALN Form AS-1 (Declarant)","Per CSC Resolution No. 2500632","Promulgated on 25 June 2025"].forEach((t,k)=>pdf.text(t,6.2,.3+k*.12));
  pdf.addImage(c.toDataURL("image/jpeg",.95),"JPEG",.5,.7,7.5,c.height*7.5/cv.width)}
 return pdf.output("blob")}
async function doDl(e){const f=`SALN-${e.year}-${(e.d.fam||"declarant").replace(/[^\w-]+/g,"_")}`;toast("Preparing PDF…");
 try{save(f+".pdf",await mkPdf(e),"PDF ready.")}catch(x){save(f+".html",fullDoc(e),"PDF isn’t available here, so an HTML copy was saved. Open it and print.")}}
/* ---------- combobox ---------- */
const CB=document.createElement("div");CB.id="cb";CB.hidden=true;CB.setAttribute("role","listbox");document.body.append(CB);
let cbIn=null,cbI=-1,cbL=[];
function cbShow(inp){cbIn=inp;const src=listFor(inp),v=inp.value.trim().toLowerCase();let m=v?src.filter(x=>x.toLowerCase().includes(v)):src.slice();if(v)m.sort((a,b)=>b.toLowerCase().startsWith(v)-a.toLowerCase().startsWith(v));cbL=m.slice(0,40);cbI=-1;
 const r=inp.getBoundingClientRect();Object.assign(CB.style,{left:r.left+"px",top:r.bottom+4+"px",width:Math.max(r.width,260)+"px"});
 CB.innerHTML=cbL.length?cbL.map((x,i)=>`<div role="option" data-i="${i}">${esc(x)}</div>`).join(""):`<div class="nm0">No match. Your text will be used as typed.</div>`;CB.hidden=false}
function cbHide(){CB.hidden=true;cbIn=null}
function sib(inp,c){const k=inp.dataset.r&&inp.dataset.r.split(":");return k?document.querySelector(`[data-r="${k[0]}:${k[1]}:${c}"]`):null}
function listFor(inp){const c=inp.dataset.combo;if(c==="reg")return REGS;if(c==="prov"||c==="city"){const P=PH[(sib(inp,"reg")||{}).value];if(c==="prov")return P?Object.keys(P):ALLP;const p=(sib(inp,"prov")||{}).value;return P&&P[p]?P[p]:P?Object.values(P).flat():ALLC}return LISTS[c]||[]}
function cbPick(i){if(!cbIn||!cbL[i])return;const c=cbIn.dataset.combo,el=cbIn;el.value=cbL[i];el.dispatchEvent(new Event("input",{bubbles:true}));cbHide();(c==="reg"?["prov","city"]:c==="prov"?["city"]:[]).forEach(x=>{const o=sib(el,x);if(o&&o.value){o.value="";o.dispatchEvent(new Event("input",{bubbles:true}));cbHide()}})}
document.addEventListener("focusin",e=>{if(e.target.dataset&&e.target.dataset.combo)cbShow(e.target)});
document.addEventListener("input",e=>{if(e.target===cbIn)cbShow(cbIn)});
document.addEventListener("keydown",e=>{if(!cbIn||CB.hidden)return;if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!cbL.length)return;cbI=(cbI+(e.key==="ArrowDown"?1:-1)+cbL.length)%cbL.length;[...CB.children].forEach((c,i)=>c.classList.toggle("on",i===cbI));CB.children[cbI].scrollIntoView({block:"nearest"})}else if(e.key==="Enter"&&cbI>=0){e.preventDefault();cbPick(cbI)}else if(e.key==="Escape"||e.key==="Tab")cbHide()});
CB.addEventListener("mousedown",e=>{e.preventDefault();const i=e.target.closest("[data-i]");if(i)cbPick(+i.dataset.i)});
document.addEventListener("click",e=>{if(e.target!==cbIn)cbHide()});
addEventListener("scroll",e=>{if(e.target!==CB&&!CB.contains(e.target))cbHide()},true);addEventListener("resize",cbHide);
/* ---------- theme, import, export ---------- */
function theme(v){document.documentElement.dataset.theme=v;try{localStorage.setItem("saln.theme",v)}catch(e){}}
try{const v=localStorage.getItem("saln.theme");if(v)document.documentElement.dataset.theme=v}catch(e){}
$("#bTheme").onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;theme(dark?"light":"dark")};
$("#bExp").onclick=()=>entries.length?save("saln-export.json",JSON.stringify({app:"saln",version:1,entries},null,2),"Exported "+entries.length+" entries."):toast("Nothing to export yet.");
$("#bImp").onclick=()=>$("#file").click();
$("#file").onchange=async ev=>{
 const f=ev.target.files[0];ev.target.value="";if(!f)return;
 try{const j=JSON.parse(await f.text());const inc=(j.app==="saln"?j.entries:null);if(!Array.isArray(inc))throw 0;
  const clean=inc.filter(x=>x&&x.year&&x.d).map(x=>({...blank(),...x,id:x.id||uid()}));
  if(!clean.length)throw 0;
  if(!await ask("Import "+clean.length+" entries?","Entries with the same ID will be replaced; others will be added.","Import"))return;
  clean.forEach(x=>{const i=entries.findIndex(y=>y.id===x.id);i<0?entries.push(x):entries[i]=x});
  store.set(entries);cur=null;render();toast("Imported "+clean.length+" entries")
 }catch(x){toast("That file isn’t a valid SALN export.")}
};
const TOUR=[
 ["Welcome","This guide points to each section in turn. Use Next, or press Esc to leave at any time.","header .logo","l"],
 ["Start a new SALN","Press New SALN to create the statement for a filing year.","[data-new]","l"],
 ["Declarant","Set the “As of” date (usually December 31 of the filing year), then your name, position and agency. Position and agency are search-and-type fields.","#s-d","e"],
 ["Real properties","Add a row for each lot, house or condominium. Hover or tap the “i” icons for hints, and choose region, province and city for the exact location.","#s-real","e"],
 ["Personal properties","List cash, vehicles, investments and similar items with their acquisition year and cost.","#s-personal","e"],
 ["Liabilities","List loans and debts with the creditor and the outstanding balance.","#s-liab","e"],
 ["Business interests","Declare any business, shares or financial connections. Leave it empty if you have none.","#s-biz","e"],
 ["Totals, preview and save","Totals update as you type. Press Preview to check the official layout, then Save.",".bar","e"],
 ["Your entries","Each year has its own entry. Preview, Print, Download PDF, Copy to next year, Edit and Remove are on each card.",".entry .acts|#lst","l"],
 ["Backups","Export saves all entries to a file and Import restores them. Do this regularly, since data stays in this browser.","#bExp","l"]];
let ti=-1;
const tEl=()=>TOUR[ti][2].split("|").map(x=>document.querySelector(x)).find(Boolean);
function tour(i){
 if(i===0&&cur&&dirty){toast("Save or cancel your edits first, then open the guide.",4000);return}
 ti=i;const m=TOUR[i][3];if(m==="e"&&!cur){cur=blank();dirty=false;render()}else if(m==="l"&&cur){cur=null;render()}
 $("#tN").textContent="Step "+(i+1)+" of "+TOUR.length;$("#tT").textContent=TOUR[i][0];$("#tM").textContent=TOUR[i][1];
 $("#tDots").innerHTML=TOUR.map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("");$("#tBack").disabled=!i;$("#tNext").textContent=i===TOUR.length-1?"Done":"Next";
 $("#tcard").hidden=false;const el=tEl();if(el)el.scrollIntoView({block:el.getBoundingClientRect().height>innerHeight*.6?"start":"center"});requestAnimationFrame(place)}
function place(){if(ti<0)return;const el=tEl(),sp=$("#tspot"),c=$("#tcard");if(!el){sp.hidden=true;return}
 const r=el.getBoundingClientRect();sp.hidden=false;Object.assign(sp.style,{left:r.left-6+"px",top:r.top-6+"px",width:r.width+12+"px",height:r.height+12+"px"});
 const h=c.offsetHeight,big=r.height>innerHeight*.6;let top=big?innerHeight-h-12:r.bottom+14;if(!big&&top+h>innerHeight-8)top=r.top-h-14;
 c.style.top=Math.max(8,top)+"px";c.style.left=Math.min(Math.max(8,r.left),innerWidth-c.offsetWidth-8)+"px"}
function closeTour(){ti=-1;$("#tcard").hidden=true;$("#tspot").hidden=true;if(cur&&!dirty){cur=null;render()}}
addEventListener("scroll",place,true);addEventListener("resize",place);
addEventListener("keydown",e=>{if(e.key==="Escape"&&ti>=0)closeTour()});
$("#tNext").onclick=()=>ti===TOUR.length-1?closeTour():tour(ti+1);$("#tBack").onclick=()=>tour(ti-1);$("#tSkip").onclick=closeTour;$("#bTour").onclick=()=>tour(0);
render();
try{if(!localStorage.getItem("saln.tour")){localStorage.setItem("saln.tour","1");tour(0)}}catch(e){}
</script>
